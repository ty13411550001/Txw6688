<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简洁的在线照片相册" />
    <title>我的照片相册</title>
    <style>
      :root { color-scheme: dark; --ink: #f8f5ff; --muted: #c7c1dc; --panel: rgba(24, 18, 43, .76); --accent: #c4a5ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; background: radial-gradient(circle at 16% 10%, #5c338a 0, transparent 28rem), radial-gradient(circle at 88% 82%, #253c7b 0, transparent 26rem), #100d1d; }
      main { width: min(1100px, calc(100% - 32px)); margin: auto; padding: 64px 0; }
      header { text-align: center; margin-bottom: 42px; }
      h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 4.8rem); letter-spacing: .08em; }
      header p { color: var(--muted); font-size: 1.05rem; }
      .notice { margin: 0 auto 32px; max-width: 650px; padding: 14px 18px; border: 1px solid rgba(196,165,255,.45); border-radius: 14px; background: var(--panel); color: var(--muted); text-align: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
      figure { margin: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 18px; background: var(--panel); box-shadow: 0 12px 30px rgba(0,0,0,.25); }
      img { width: 100%; aspect-ratio: 1 / 1; display: block; object-fit: cover; cursor: zoom-in; transition: transform .25s; }
      img:hover { transform: scale(1.04); }
      figcaption { padding: 11px 13px; color: var(--muted); }
      dialog { width: min(96vw, 1000px); padding: 0; border: 0; background: transparent; }
      dialog::backdrop { background: rgba(0,0,0,.85); }
      dialog img { width: auto; max-width: 96vw; max-height: 92vh; aspect-ratio: auto; cursor: zoom-out; }
      .empty { grid-column: 1 / -1; min-height: 230px; display: grid; place-items: center; border: 2px dashed rgba(196,165,255,.55); border-radius: 18px; color: var(--muted); text-align: center; padding: 24px; }
      footer { margin-top: 42px; text-align: center; color: var(--muted); font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>我的照片相册</h1>
        <p>记录每一份值得珍藏的瞬间</p>
      </header>
      <p class="notice">请尊重照片中每个人的隐私；未经许可，请勿转载、保存或传播。</p>
      <section class="grid" id="gallery" aria-label="照片相册"></section>
      <footer>© 2026 我的照片相册</footer>
    </main>
    <dialog id="viewer"><img alt="放大的照片" /></dialog>
    <script>
      const gallery = document.querySelector('#gallery');
      const dialog = document.querySelector('#viewer');
      const viewer = dialog.querySelector('img');
      let foundPhotos = 0;
      // 将照片命名为 1、2、3……（保留原来的 .jpg 或 .png 后缀），网站会自动显示。
      for (let number = 1; number <= 100; number++) {
        for (const extension of ['jpg', 'jpeg', 'png', 'webp']) {
        const file = `${number}.${extension}`;
        const figure = document.createElement('figure');
        const img = document.createElement('img');
        img.src = `photos/${file}`;
        img.alt = `照片 ${number}`;
        img.loading = 'lazy';
        img.onerror = () => figure.remove();
        img.onload = () => { foundPhotos++; };
        img.onclick = () => { viewer.src = img.src; viewer.alt = img.alt; dialog.showModal(); };
        const caption = document.createElement('figcaption');
        caption.textContent = `照片 ${number}`;
        figure.append(img, caption);
        gallery.append(figure);
        }
      }
      setTimeout(() => {
        if (!foundPhotos) gallery.innerHTML = '<div class="empty">相册已创建。<br>请将照片放进 <code>photos</code> 文件夹，并命名为 <code>1.jpg</code>、<code>2.jpg</code>、<code>3.jpg</code>……</div>';
      }, 500);
      dialog.onclick = () => dialog.close();
    </script>
  </body>
</html>
